:root{--ink:#24251f;--muted:#696b60;--line:rgba(211,212,198,.7)}

.toolbar button:active{transform:none}

<div class="app"><aside class="sidebar"><div class="brand"><svg viewBox="0 0 36 36" fill="none" stroke="#a6e5cf" stroke-width="1.5"><path d="M4 12L18 4l14 8v14l-14 8-14-8zM4 12l14 8 14-8M18 20v14M4 19l14 8 14-8"/></svg><div><b>Fort Mason</b></div></div>
<section class="building-section"><h2 class="section-title">공간 선택</h2><div class="buildings"><button data-building="festival" class="building active"><div><strong>Festival Pavilion</strong><small>메인 행사장</small></div><i class="dot"></i></button><button data-building="gateway" class="building"><div><strong>Gateway</strong><small>스타트업 부스+푸드코트</small></div><i class="dot"></i></button></div></section>
